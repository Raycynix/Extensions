name: PR Policy

on:
  pull_request:
    branches:
      - release
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  label-policy:
    name: Required PR Labels
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name)

            const changelogLabels = [
              'bug',
              'feature',
              'breaking change',
              'security',
              'improvement',
              'documentation',
              'tests',
              'ci',
              'dependencies',
              'maintenance'
            ]

            const hasSkipChangelog = labels.includes('skip changelog')
            const selectedChangelogLabels = labels.filter(label => changelogLabels.includes(label))

            if (hasSkipChangelog) {
              core.info('skip changelog is present. Changelog label is not required.')
              return
            }

            if (selectedChangelogLabels.length === 0) {
              core.setFailed(
                `PR must have one changelog label: ${changelogLabels.join(', ')}. ` +
                `Or use: skip changelog.`
              )
              return
            }

            if (selectedChangelogLabels.length > 1) {
              core.setFailed(
                `PR must have only one changelog label. Found: ${selectedChangelogLabels.join(', ')}`
              )
              return
            }

            core.info(`Changelog label OK: ${selectedChangelogLabels[0]}`)